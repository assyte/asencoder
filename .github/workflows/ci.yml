name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Kalite Kontrolleri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: TypeScript kontrolü
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Üretim derlemesi
        run: npm run build

      - name: Statik çıktı doğrulama
        run: |
          test -f out/index.html || (echo "::error::out/index.html üretilmedi" && exit 1)
          echo "Statik export üretildi: $(du -sh out | cut -f1)"

  security:
    name: Güvenlik Denetimi
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # Yalnızca *çalışma zamanı* bağımlılıkları denetlenir.
      #
      # `--omit=dev` kullanmamızın sebebi: raporlanan uyarıların tamamı
      # build-time araçlardan geliyor (chokidar, fast-glob, glob,
      # @next/eslint-plugin-next). Bunlar tarayıcıya paketlenmez,
      # üretim bundle'ına girmez ve çalışma zamanında kod çalıştırmaz.
      #
      # Bu projede `next` sürümü zaten en güncel (16.4.2); üretim
      # bağımlılıklarında 0 açık bekleniyor.
      - name: Üretim bağımlılıklarında açık denetim
        run: npm audit --omit=dev --audit-level=high

      # Tüm bağımlılıklar için rapor (CI'yı kırmaz, bilgi amaçlı)
      - name: Tüm bağımlılıklar raporu (bilgi amaçlı)
        run: npm audit --audit-level=critical || true